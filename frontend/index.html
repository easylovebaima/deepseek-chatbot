<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 对话机器人 · DeepSeek</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 顶部应用栏 -->
  <header class="appbar">
    <div class="appbar-inner">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true">
            <path d="M12 2a4 4 0 0 0-4 4v.5A5 5 0 0 0 4 11v4a3 3 0 0 0 3 3h2a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H8.5A3.5 3.5 0 0 1 12 8.5 3.5 3.5 0 0 1 15.5 11H15a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h2a3 3 0 0 0 3-3v-4a5 5 0 0 0-4-5.5V6a4 4 0 0 0-4-4Z"
              stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <circle cx="9.5" cy="9" r="0.7" fill="currentColor"/>
            <circle cx="14.5" cy="9" r="0.7" fill="currentColor"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>AI 对话机器人</h1>
          <span class="brand-sub">
            <i class="status-dot" id="statusDot"></i>
            <span id="statusText">DeepSeek 连接中…</span>
          </span>
        </div>
      </div>
      <div class="appbar-actions">
        <button class="icon-btn" id="clearBtn" title="清空对话" aria-label="清空对话">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
            <path d="M4 7h16M10 4h4M6 7l1 13a1 1 0 0 0 1 .9h8a1 1 0 0 0 1-.9L18 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10 11v5M14 11v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="icon-btn" id="themeToggle" title="切换主题" aria-label="切换主题">
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true" style="display:none">
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 聊天区域 -->
  <main class="chat" id="chat">
    <!-- 欢迎页 -->
    <div class="welcome" id="welcome">
      <div class="welcome-badge">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" aria-hidden="true">
          <path d="M12 2a4 4 0 0 0-4 4v.5A5 5 0 0 0 4 11v4a3 3 0 0 0 3 3h2a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H8.5A3.5 3.5 0 0 1 12 8.5 3.5 3.5 0 0 1 15.5 11H15a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h2a3 3 0 0 0 3-3v-4a5 5 0 0 0-4-5.5V6a4 4 0 0 0-4-4Z"
            stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <circle cx="9.5" cy="9" r="0.7" fill="currentColor"/>
          <circle cx="14.5" cy="9" r="0.7" fill="currentColor"/>
        </svg>
      </div>
      <h2>你好，我是你的 AI 助手</h2>
      <p>由 DeepSeek 大模型驱动，随时为你答疑解惑</p>
      <div class="suggestions" id="suggestions">
        <button class="chip" data-q="你好，请介绍一下你自己">👋 你好，介绍一下你自己</button>
        <button class="chip" data-q="用 Python 写一个快速排序">🐍 用 Python 写个快速排序</button>
        <button class="chip" data-q="什么是 FastAPI？它有什么优势？">⚡ 什么是 FastAPI？</button>
        <button class="chip" data-q="给我讲个冷笑话">😂 给我讲个冷笑话</button>
      </div>
    </div>

    <!-- 消息列表 -->
    <div class="messages" id="messages"></div>
  </main>

  <!-- 底部输入区 -->
  <footer class="composer-wrap">
    <div class="composer">
      <textarea id="messageInput" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行…"></textarea>
      <button class="send-btn" id="sendBtn" title="发送" aria-label="发送">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
          <path d="M4 12 20 4l-4 16-4.5-6.5L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M11.5 13.5 20 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <p class="composer-note">AI 生成内容仅供参考，请注意甄别</p>
  </footer>

  <script src="js/lib/axios.min.js"></script>
  <script src="js/lib/marked.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
